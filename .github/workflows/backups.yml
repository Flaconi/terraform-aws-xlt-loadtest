---
name: Backup Repository

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    uses: Flaconi/github-reusable-workflow/.github/workflows/backups.yml@v1
    with:
      enabled: True
      region: eu-central-1
    secrets:
      iam_role_arn: ${{ secrets.BACKUP_REPO_IAM_ROLE }}
      bucket_name: ${{ secrets.BACKUP_REPO_BUCKET }}
